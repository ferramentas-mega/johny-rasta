# Verificação a cada push: tipos, lint, testes e build.
#
# Existe porque a pergunta "o build quebrou?" custou, uma vez, um clone limpo
# inteiro para ser respondida. Agora a resposta é um check verde ou vermelho na
# própria tela do commit.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # O CI usa o superusuário do serviço para criar banco, papéis e massa —
      # é o mesmo caminho do `npm run setup` numa máquina nova. As senhas dos
      # papéis são descartáveis: vivem só neste contêiner efêmero.
      DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://app_user:ci@localhost:5432/painel_matrix
      DATABASE_URL_INGEST: postgres://app_ingest:ci@localhost:5432/painel_matrix
      DATABASE_URL_FORMS: postgres://app_forms:ci@localhost:5432/painel_matrix
      SESSION_SECRET: segredo-de-ci-sem-valor-fora-daqui
      APP_URL: http://localhost:3000
      TEST_DATABASE_NAME: painel_matrix_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Banco, papéis e migrações
        run: npm run db:setup

      - run: npm run typecheck
      - run: npm run lint
      # Sistema visual: paridade entre os temas, nenhuma tela inventando cor, e
      # contraste mínimo de 4,5:1 em todo par texto-sobre-fundo. Sai com código
      # 1 se divergir, então a regressão para aqui em vez de chegar à tela.
      - run: npm run design
      - run: npm test

      # O build vem ANTES do navegador por dois motivos. O barato: build
      # quebrado é descoberto em segundos, não depois de dois minutos de
      # Playwright. O que importa: a suíte passa a rodar contra o pacote
      # publicado (`next start`), e não contra o servidor de desenvolvimento.
      # A diferença é medível — o modo de desenvolvimento compila com `eval`,
      # então a CSP acusa milhares de violações que não existem em produção, e
      # uma política medida ali levaria a afrouxar o que de fato vai ao ar.
      - run: npm run build

      - name: Navegador, contra o pacote publicado
        run: |
          npx playwright install --with-deps chromium
          E2E_PROD=1 npm run test:e2e
