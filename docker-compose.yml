# Postgres para desenvolvimento, para quem não quer instalar o banco na máquina.
#
#   docker compose up -d
#   npm run setup
#
# O volume mantém os dados entre reinícios. Para começar do zero:
#   docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    container_name: painel-matrix-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: painel_dev_admin
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - painel-dados:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  painel-dados:
